app = "oni-quest-advisor"
primary_region = "fra"

[build]

[mounts]
  source = "oni_quest_data"
  destination = "/data"

[env]
  PORT = "3000"
  ORIGIN = "https://oni-quest-advisor.fly.dev"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
