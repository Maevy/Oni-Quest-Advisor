# Staging config for the experimental test deployment.
# Same shape as fly.toml but a separate app + its own fresh volume, so testers
# can exercise unreleased `develop` features at their own URL without touching
# production (oni-quest-advisor, which runs the released tag) and without a prod
# DB wipe.
# Deploy with:  flyctl deploy --config fly.test.toml --app oni-quest-advisor-test
app = "oni-quest-advisor-test"
primary_region = "fra"

[build]

[mounts]
  source = "oni_quest_data"
  destination = "/data"

[env]
  PORT = "3000"
  ORIGIN = "https://oni-quest-advisor-test.fly.dev"
  DATA_DIR = "/data"
  # Without this, getClientAddress() returns the Fly proxy's internal IP for
  # every player, keying the rate limiter on one shared bucket. adapter-node
  # reads the rightmost x-forwarded-for entry (XFF_DEPTH=1) — the one Fly's
  # edge appends, i.e. the real client IP.
  ADDRESS_HEADER = "x-forwarded-for"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Staging auto-stops and wakes on request (~4.71s cold, measured 2026-10-25), which is fine for
  # testers browsing unreleased `develop`. It was briefly pinned to 1 (9c49a3f) for one reason
  # only: Discord allows an interaction 3s and a cold wake overruns that, so the interaction is
  # dropped without the app ever logging it. The Interactions Endpoint URL now points at
  # PRODUCTION (switched 2026-10-26, v0.11.0), which carries min_machines_running = 1 instead, so
  # the constraint no longer applies here and this app can sleep.
  # **If the endpoint URL is ever pointed back at this app, set this to 1 and redeploy FIRST** -
  # otherwise the bot fails silently on every cold start, with nothing in the log to show why.
  min_machines_running = 0

# Probes /api/health on running machines (DB reachable, aggregates report).
# Health checks do not auto-start a stopped machine — requests still do.
[[http_service.checks]]
  grace_period = "10s"
  interval = "1m"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
